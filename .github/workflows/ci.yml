name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      # Only check for actual errors (syntax errors, undefined names).
      # Style warnings are informational only (exit-zero).
      # black/isort are skipped — the existing codebase was not
      # written with those formatters and would fail every run.
      - name: Flake8 — syntax errors and undefined names
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics \
            --exclude=.git,__pycache__,data,venv,.venv

      - name: Flake8 — style warnings (informational)
        run: |
          flake8 . \
            --count \
            --exit-zero \
            --max-line-length=127 \
            --max-complexity=10 \
            --statistics \
            --exclude=.git,__pycache__,data,venv,.venv
        continue-on-error: true

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install test dependencies only
        # Heavy packages (torch, faiss, chromadb) are mocked in tests
        # so we only need the web framework and test tools here.
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn python-multipart python-dotenv pillow \
                      numpy pytest pytest-cov httpx

      - name: Run tests
        run: |
          pytest tests/ -v --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
        if: always()

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan requirements for known CVEs
        run: |
          pip install safety
          safety check -r requirements.txt --json || true
        continue-on-error: true

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Just verify the image builds cleanly from the Dockerfile.
      # A real runtime smoke test is not possible in CI because the
      # app requires the data volume (FAISS index, ChromaDB) and a
      # live GROQ_API_KEY — those only exist on the server.
      - name: Build Docker image
        run: |
          docker build -t medicinal-plants:${{ github.sha }} .
          echo "Image built successfully: medicinal-plants:${{ github.sha }}"

      - name: Verify image exists
        run: |
          docker image inspect medicinal-plants:${{ github.sha }} \
            --format '{{.Id}} {{.Size}}' \
            | awk '{printf "Image ID: %s\nSize: %.1f MB\n", $1, $2/1024/1024}'

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, security, build]
    if: always()

    steps:
      - name: Check CI status
        run: |
          echo "CI pipeline completed"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Build: ${{ needs.build.result }}"
