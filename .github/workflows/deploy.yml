name: Deploy to Server

on:
  # Only runs manually — CI must pass first on main
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm deployment'
        required: true
        default: ''

env:
  APP_DIR: /home/deployuser/app
  IMAGE_NAME: medicinal-plants

jobs:
  guard:
    name: Deployment Guard
    runs-on: ubuntu-latest

    steps:
      - name: Confirm deployment input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "Deployment not confirmed. Type 'deploy' to proceed."
            exit 1
          fi
          echo "Deployment confirmed by ${{ github.actor }}"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: guard

    steps:
      # ── 1. Checkout code ────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Write SSH key ─────────────────────────────────────────
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # ── 3. Sync code to server ───────────────────────────────────
      - name: Sync code to server
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude 'tests/' \
            --exclude '*.egg-info' \
            --exclude '.pytest_cache' \
            --exclude 'coverage.xml' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            ./ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.APP_DIR }}/

      # ── 4. Build and deploy on server ────────────────────────────
      # Server is CentOS — uses dnf/yum, systemctl for docker service
      - name: Build and deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              'bash -s' << 'ENDSSH'
            set -e

            IMAGE_TAG=${{ github.sha }}
            APP_DIR=${{ env.APP_DIR }}
            IMAGE_NAME=${{ env.IMAGE_NAME }}

            # ── Ensure Docker is installed and running ───────────
            # deployuser must be in the docker group or have passwordless
            # sudo access. If deploying for the first time, run on server:
            #   sudo usermod -aG docker deployuser
            #   newgrp docker
            if ! command -v docker &>/dev/null; then
              echo "ERROR: Docker is not installed on this server."
              echo "Install Docker manually and add deployuser to docker group."
              exit 1
            fi

            # Verify deployuser can run docker without sudo
            if ! docker info >/dev/null 2>&1; then
              echo "ERROR: deployuser cannot run docker."
              echo "Add to docker group: sudo usermod -aG docker $(whoami) && newgrp docker"
              exit 1
            fi

            cd ${APP_DIR}

            # ── Ensure data directories exist ─────────────────
            mkdir -p ${APP_DIR}/data/queries ${APP_DIR}/data/chroma_db

            # ── Write .env from GitHub secrets ───────────────
            cat > ${APP_DIR}/.env << 'EOF'
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            EOF
            chmod 600 ${APP_DIR}/.env

            # ── Build Docker image on server ─────────────────
            echo "Building Docker image..."
            docker build -t ${IMAGE_NAME}:${IMAGE_TAG} .
            docker tag ${IMAGE_NAME}:${IMAGE_TAG} ${IMAGE_NAME}:latest

            # ── Stop and remove old container ─────────────────
            echo "Stopping old container..."
            docker stop ${IMAGE_NAME} 2>/dev/null || true
            docker rm   ${IMAGE_NAME} 2>/dev/null || true

            # ── Start new container ───────────────────────────
            # Resource limits prevent runaway memory/CPU/disk usage:
            #   --memory=25g          max 25GB RAM
            #   --memory-swap=25g     no swap (mem+swap = mem)
            #   --cpus=2.0            max 2 CPU cores
            #   --pids-limit=512      max 512 processes
            echo "Starting new container with resource limits..."
            docker run -d \
              --name ${IMAGE_NAME} \
              --restart unless-stopped \
              -p 8000:8000 \
              --memory=25g \
              --memory-swap=25g \
              --cpus=2.0 \
              --pids-limit=512 \
              --env-file ${APP_DIR}/.env \
              -v ${APP_DIR}/data:/app/data \
              ${IMAGE_NAME}:latest

            # ── Set up query cleanup cron (runs daily) ────────
            # Deletes uploaded query images older than 7 days to
            # prevent unbounded disk growth.
            CRON_CMD="0 2 * * * find ${APP_DIR}/data/queries -type f -mtime +7 -delete"
            (crontab -l 2>/dev/null | grep -v "data/queries"; echo "${CRON_CMD}") | crontab -
            echo "Query cleanup cron installed (daily at 2am)"

            # ── Health check ──────────────────────────────────
            echo "Waiting for app to start..."
            sleep 15
            curl -sf http://localhost:8000/health \
              || (echo "Health check failed" && docker logs ${IMAGE_NAME} --tail 50 && exit 1)

            # ── Prune old images ──────────────────────────────
            docker image prune -f

            echo "Deployment complete by ${{ github.actor }} @ ${{ github.sha }}"
          ENDSSH
