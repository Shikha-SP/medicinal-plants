name: Deploy to Server

on:
  push:
    branches:
      - main

env:
  APP_DIR: /home/deployuser/app
  IMAGE_NAME: medicinal-plants

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Write SSH key ─────────────────────────────────────────
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # ── 3. Sync code to server ───────────────────────────────────
      # Uploads the entire repo to the server.
      # .gitignore excludes: .env, data/, __pycache__, etc.
      # Those never get synced from the repo.
      - name: Sync code to server
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            ./ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.APP_DIR }}/

      # ── 4. Deploy on server ──────────────────────────────────────
      - name: Build and deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              bash -s << 'ENDSSH'
            set -e

            IMAGE_TAG="${{ github.sha }}"
            APP_DIR="${{ env.APP_DIR }}"
            IMAGE_NAME="${{ env.IMAGE_NAME }}"

            cd ${APP_DIR}

            # ── Write .env from GitHub secrets ───────────────
            # .env is gitignored — injected here from secrets
            # so it never touches the repo.
            echo "Writing .env file..."
            cat > .env << EOF
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            EOF
            chmod 600 .env

            # ── Build Docker image on server ─────────────────
            echo "Building Docker image..."
            docker build -t ${IMAGE_NAME}:${IMAGE_TAG} .
            docker tag ${IMAGE_NAME}:${IMAGE_TAG} ${IMAGE_NAME}:latest

            # ── Stop and remove old container ─────────────────
            echo "Stopping old container..."
            docker stop ${IMAGE_NAME} 2>/dev/null || true
            docker rm   ${IMAGE_NAME} 2>/dev/null || true

            # ── Start new container ───────────────────────────
            # Volume mount explanation:
            #   ${APP_DIR}/data → /app/data
            #     Provides FAISS index, metadata, knowledge base
            #     and gives chroma_db/ a persistent home so
            #     ingest_chromadb.py only runs on first deploy.
            #     queries/ (gitignored runtime uploads) live here.
            echo "Starting new container..."
            docker run -d \
              --name ${IMAGE_NAME} \
              --restart unless-stopped \
              -p 8000:8000 \
              --env-file ${APP_DIR}/.env \
              -v ${APP_DIR}/data:/app/data \
              ${IMAGE_NAME}:latest

            # ── Health check ──────────────────────────────────
            echo "Waiting for app to start..."
            sleep 10
            curl -sf http://localhost:8000/health \
              || (echo "Health check failed" && docker logs ${IMAGE_NAME} --tail 50 && exit 1)

            # ── Prune old images ──────────────────────────────
            echo "Pruning old images..."
            docker image prune -f

            echo "Deployment complete."
          ENDSSH
