name: Deploy to Server

on:
  # Only runs manually — CI must pass first on main
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm deployment'
        required: true
        default: ''

env:
  APP_DIR: /home/deployuser/app
  IMAGE_NAME: medicinal-plants

jobs:
  guard:
    name: Deployment Guard
    runs-on: ubuntu-latest

    steps:
      - name: Confirm deployment input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "Deployment not confirmed. Type 'deploy' to proceed."
            exit 1
          fi
          echo "Deployment confirmed by ${{ github.actor }}"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: guard

    steps:
      # ── 1. Checkout code ────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Write SSH key ─────────────────────────────────────────
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # ── 3. Sync code to server ───────────────────────────────────
      - name: Sync code to server
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude 'tests/' \
            --exclude '*.egg-info' \
            --exclude '.pytest_cache' \
            --exclude 'coverage.xml' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            ./ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.APP_DIR }}/

      # ── 4. Deploy on server ──────────────────────────────────────
      - name: Deploy on server
        env:
          IMAGE_TAG: ${{ github.sha }}
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            set -e
            cd ${{ env.APP_DIR }}
            
            echo '=== Creating .env ==='
            echo 'GROQ_API_KEY=${GROQ_KEY}' > .env
            chmod 600 .env
            
            echo '=== Building image ==='
            docker build -t ${{ env.IMAGE_NAME }}:${IMAGE_TAG} .
            docker tag ${{ env.IMAGE_NAME }}:${IMAGE_TAG} ${{ env.IMAGE_NAME }}:latest
            
            echo '=== Stopping old container ==='
            docker stop ${{ env.IMAGE_NAME }} 2>/dev/null || true
            docker rm ${{ env.IMAGE_NAME }} 2>/dev/null || true
            
            echo '=== Starting new container ==='
            docker run -d \
              --name ${{ env.IMAGE_NAME }} \
              --restart unless-stopped \
              -p 8000:8000 \
              --memory=25g \
              --memory-swap=25g \
              --cpus=2.0 \
              --env-file .env \
              -v ${{ env.APP_DIR }}/data:/app/data \
              ${{ env.IMAGE_NAME }}:latest
            
            echo '=== Health check ==='
            sleep 15
            curl -f http://localhost:8000/health || exit 1
            
            echo '=== Cleanup ==='
            docker image prune -f
            
            echo 'Deployment complete'
          "
