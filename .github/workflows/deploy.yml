name: Deploy to Server

on:
  push:
    branches:
      - main

env:
  APP_DIR: /home/deployuser/app
  IMAGE_NAME: medicinal-plants

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Docker Buildx ─────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Write SSH key ─────────────────────────────────────────
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # ── 4. Build Docker image ────────────────────────────────────
      # .dockerignore excludes: .git, __pycache__, *.pyc, .env,
      # .venv, data/chroma_db, data/plant_database.index, queries/
      # dataset/ — only source code and pip packages enter the image.
      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      # ── 5. Save image as tar and copy to server ──────────────────
      - name: Transfer Docker image to server
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} | gzip \
            | ssh -i ~/.ssh/deploy_key \
                  -p ${{ secrets.SSH_PORT }} \
                  -o StrictHostKeyChecking=no \
                  ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
                  "cat > /tmp/${{ env.IMAGE_NAME }}.tar.gz"

      # ── 6. Prepare remote directories ───────────────────────────
      # Creates /home/deployuser/app/data/{queries,chroma_db}.
      # queries/ and chroma_db/ are gitignored runtime artifacts
      # that only ever live on the server via the volume mount.
      - name: Prepare remote directories
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "mkdir -p ${{ env.APP_DIR }}/data/queries \
                         ${{ env.APP_DIR }}/data/chroma_db"

      # ── 7. Deploy on server ──────────────────────────────────────
      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              bash -s << 'ENDSSH'
            set -e

            IMAGE_TAG="${{ github.sha }}"
            APP_DIR="${{ env.APP_DIR }}"
            IMAGE_NAME="${{ env.IMAGE_NAME }}"

            # ── Load the new image ────────────────────────────
            echo "Loading Docker image..."
            docker load < /tmp/${IMAGE_NAME}.tar.gz

            # ── Write .env from GitHub secrets ───────────────
            # .env is gitignored — injected here from secrets
            # so it never touches the repo or the image.
            echo "Writing .env file..."
            cat > ${APP_DIR}/.env << EOF
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            EOF
            chmod 600 ${APP_DIR}/.env

            # ── Stop and remove old container ─────────────────
            echo "Stopping old container..."
            docker stop ${IMAGE_NAME} 2>/dev/null || true
            docker rm   ${IMAGE_NAME} 2>/dev/null || true

            # ── Start new container ───────────────────────────
            # Volume mount explanation:
            #   ${APP_DIR}/data → /app/data
            #     Provides FAISS index, metadata, knowledge base
            #     and gives chroma_db/ a persistent home so
            #     ingest_chromadb.py only runs on first deploy.
            #     queries/ (gitignored runtime uploads) live here.
            echo "Starting new container..."
            docker run -d \
              --name ${IMAGE_NAME} \
              --restart unless-stopped \
              -p 8000:8000 \
              --env-file ${APP_DIR}/.env \
              -v ${APP_DIR}/data:/app/data \
              ${IMAGE_NAME}:${IMAGE_TAG}

            # ── Health check ──────────────────────────────────
            echo "Waiting for app to start..."
            sleep 10
            curl -sf http://localhost:8000/health \
              || (echo "Health check failed" && docker logs ${IMAGE_NAME} --tail 50 && exit 1)

            # ── Prune old images ──────────────────────────────
            echo "Pruning old images..."
            docker image prune -f

            # ── Clean up tar ──────────────────────────────────
            rm -f /tmp/${IMAGE_NAME}.tar.gz

            echo "Deployment complete."
          ENDSSH
