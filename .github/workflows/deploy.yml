name: Deploy to Server

on:
  # Only runs manually — CI must pass first on main
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm deployment'
        required: true
        default: ''

env:
  APP_DIR: /home/deployuser/app
  IMAGE_NAME: medicinal-plants

jobs:
  guard:
    name: Deployment Guard
    runs-on: ubuntu-latest

    steps:
      - name: Confirm deployment input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "Deployment not confirmed. Type 'deploy' to proceed."
            exit 1
          fi
          echo "Deployment confirmed by ${{ github.actor }}"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: guard

    steps:
      # ── 1. Checkout code ────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Write SSH key ─────────────────────────────────────────
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # ── 3. Sync code to server ───────────────────────────────────
      - name: Sync code to server
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude 'tests/' \
            --exclude '*.egg-info' \
            --exclude '.pytest_cache' \
            --exclude 'coverage.xml' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            ./ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.APP_DIR }}/

      # ── 4. Build and deploy on server ────────────────────────────
      # Server is CentOS — uses dnf/yum, systemctl for docker service
      - name: Build and deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              bash -s << ENDSSH
            set -e

            IMAGE_TAG="${{ github.sha }}"
            APP_DIR="${{ env.APP_DIR }}"
            IMAGE_NAME="${{ env.IMAGE_NAME }}"

            # ── Ensure Docker is installed (CentOS) ───────────
            if ! command -v docker &>/dev/null; then
              echo "Docker not found — installing on CentOS..."
              sudo dnf -y install dnf-plugins-core
              sudo dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
              sudo dnf -y install docker-ce docker-ce-cli containerd.io
              sudo systemctl enable docker
              sudo systemctl start docker
              # Allow deployuser to run docker without sudo
              sudo usermod -aG docker \$(whoami)
              echo "Docker installed. Re-login may be needed for group changes."
            fi

            # ── Ensure Docker daemon is running ───────────────
            if ! sudo systemctl is-active --quiet docker; then
              echo "Starting Docker service..."
              sudo systemctl start docker
            fi

            cd \${APP_DIR}

            # ── Ensure data directories exist ─────────────────
            mkdir -p \${APP_DIR}/data/queries \${APP_DIR}/data/chroma_db

            # ── Write .env from GitHub secrets ───────────────
            cat > \${APP_DIR}/.env << EOF
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            EOF
            chmod 600 \${APP_DIR}/.env

            # ── Build Docker image on server ─────────────────
            echo "Building Docker image..."
            docker build -t \${IMAGE_NAME}:\${IMAGE_TAG} .
            docker tag \${IMAGE_NAME}:\${IMAGE_TAG} \${IMAGE_NAME}:latest

            # ── Stop and remove old container ─────────────────
            echo "Stopping old container..."
            docker stop \${IMAGE_NAME} 2>/dev/null || true
            docker rm   \${IMAGE_NAME} 2>/dev/null || true

            # ── Start new container ───────────────────────────
            echo "Starting new container..."
            docker run -d \
              --name \${IMAGE_NAME} \
              --restart unless-stopped \
              -p 8000:8000 \
              --env-file \${APP_DIR}/.env \
              -v \${APP_DIR}/data:/app/data \
              \${IMAGE_NAME}:latest

            # ── Health check ──────────────────────────────────
            echo "Waiting for app to start..."
            sleep 15
            curl -sf http://localhost:8000/health \
              || (echo "Health check failed" && docker logs \${IMAGE_NAME} --tail 50 && exit 1)

            # ── Prune old images ──────────────────────────────
            docker image prune -f

            echo "Deployment complete by ${{ github.actor }} @ ${{ github.sha }}"
          ENDSSH
