name: Deploy to Server

on:
  # Only runs manually — CI must pass first on main
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm deployment'
        required: true
        default: ''

env:
  APP_DIR: /home/deployuser/app
  IMAGE_NAME: medicinal-plants

jobs:
  guard:
    name: Deployment Guard
    runs-on: ubuntu-latest

    steps:
      - name: Confirm deployment input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "Deployment not confirmed. Type 'deploy' to proceed."
            exit 1
          fi
          echo "Deployment confirmed by ${{ github.actor }}"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: guard

    steps:
      # ── 1. Checkout code ────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Write SSH key ─────────────────────────────────────────
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # ── 3. Sync code to server ───────────────────────────────────
      - name: Sync code to server
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude 'tests/' \
            --exclude '*.egg-info' \
            --exclude '.pytest_cache' \
            --exclude 'coverage.xml' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            ./ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.APP_DIR }}/

      # ── 4. Deploy on server ──────────────────────────────────────
      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "cd ${{ env.APP_DIR }} && \
               echo 'GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}' > .env && \
               chmod 600 .env && \
               echo '=== Building ===' && \
               docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} . && \
               docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest && \
               echo '=== Stopping old container ===' && \
               docker stop ${{ env.IMAGE_NAME }} 2>/dev/null || true && \
               docker rm ${{ env.IMAGE_NAME }} 2>/dev/null || true && \
               echo '=== Starting container ===' && \
               docker run -d --name ${{ env.IMAGE_NAME }} --restart unless-stopped -p 8000:8000 --memory=25g --memory-swap=25g --cpus=2.0 -e GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} -v ${{ env.APP_DIR }}/data:/app/data ${{ env.IMAGE_NAME }}:latest && \
               echo '=== Waiting for startup ===' && \
               sleep 15 && \
               curl -f http://localhost:8000/health && \
               docker image prune -f && \
               echo '=== Done ==='"
